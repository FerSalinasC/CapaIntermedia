<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reportar a Juan Perez - Skill Learn</title>

    <link rel="stylesheet" href="Base.css">
    <link rel="stylesheet" href="ProfileMenu.css">
    <link rel="stylesheet" href="CrearReporte.css">
</head>

<body>

<header class="navbar">

    <a href="Home.html" class="logo">
        Skill Learn
    </a>

    <div class="search-container">
        <input type="text" placeholder="Buscar clases">

        <button class="search-button" aria-label="Buscar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
            </svg>
        </button>
    </div>

    <div class="profile-menu-wrapper">
        <a class="message-button" href="Mensaje.html" aria-label="Abrir mensajes">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="m3 7 9 6 9-6"></path>
            </svg>
        </a>

        <button class="profile-button" type="button" aria-label="Abrir menú de perfiles" aria-expanded="false" aria-controls="profileMenu">
            <img
                src="https://i.pinimg.com/736x/43/b8/f7/43b8f757efbe31ed48e6875165f3ee5d.jpg"
                alt="Mi perfil"
            >
        </button>

        <nav id="profileMenu" class="profile-menu" aria-label="Perfiles" hidden>
            <a href="PerfilAlumno.html">Perfil Alumno</a>
            <a href="PerfilInstructor.html">Perfil Instructor</a>
            <a href="PerfilAdmin.html">Perfil Administrador</a>
        </nav>
    </div>

</header>

<main class="report-page">
    <section class="report-box" aria-labelledby="report-title">
        <h1 id="report-title">Reportar a Juan Perez</h1>

        <form class="report-form">
            <div class="input-group">
                <label for="report-reason">Motivo del reporte</label>
                <textarea id="report-reason" name="report-reason" placeholder="Motivo del reporte"></textarea>
            </div>

            <div class="input-group">
                <label for="report-evidence">Pruebas</label>
                <input type="file" id="report-evidence" name="report-evidence" accept="image/*" multiple>
                <label class="upload-button" for="report-evidence">Pruebas</label>
            </div>
        </form>
    </section>
</main>

<script src="ProfileMenu.js"></script>
</body>
</html>
