<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inicio de Sesión - Skill Learn</title>
<link rel="stylesheet" href="InicarSesion.css">

</head>
<body>

<header class="navbar">
    <a href="LandingPage.html" class="logo">
        Skill Learn
    </a>
</header>

<main class="login-container">

    <div class="login-box">

        <h1>Inicio de Sesión</h1>

        <form id="loginForm">
            <div class="form-error" id="loginFormError" role="alert"></div>

            <div class="input-group">
                <label for="nombre">Nombre</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingresa tu nombre"
                >
                <span class="error" id="nombreError"></span>
            </div>


            <div class="input-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                >
                <span class="error" id="passwordError"></span>
            </div>


            <div class="buttons">

                <button type="submit" class="btn ingresar">
                    Ingresar
                </button>

                <a href="LandingPage.html" class="btn regresar">
                    Regresar
                </a>

            </div>


            <p class="register-text">
                ¿No tienes cuenta?,
                <a href="RegistrarUsuario.html">
                    Registrarse
                </a>
            </p>

        </form>

    </div>

</main>

<script src="ValidacionInicio.js"></script>
</body>
</html>
