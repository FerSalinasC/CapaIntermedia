<!DOCTYPE html>

<html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crear Cuenta - Skill Learn</title>

<link rel="stylesheet" href="RegistrarUsuario.css">

</head>

<body>

<header class="navbar">
    <a href="LandingPage.html" class="logo">
        Skill Learn
    </a>
</header>

<main class="register-container">
    <div class="register-box">
        <h1>Crear Cuenta</h1>
        <form id="registerForm">
            <div class="form-error" id="registerFormError" role="alert"></div>

            <div class="input-group">
                <label for="nombre">Nombre y apellido</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre y apellido">
                <span class="error" id="nombreError"></span>
            </div>

            <div class="input-group">
                <label for="genero">Género</label>

                <select id="genero" name="genero">

                    <option value="">
                        Selecciona una opción
                    </option>

                    <option value="Femenino">
                        Femenino
                    </option>

                    <option value="Masculino">
                        Masculino
                    </option>

                    <option value="No binario">
                        No binario
                    </option>

                </select>

                <span class="error" id="generoError"></span>
            </div>

            <div class="input-group">
                <label for="fechaNacimiento">
                    Fecha de nacimiento
                </label>

                <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                <span class="error" id="fechaError"></span>
            </div>

            <div class="input-group">
                <label for="email">
                    Email
                </label>

                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                <span class="error" id="emailError"></span>
            </div>

            <div class="input-group">
                <label>
                    Foto
                </label>

                <div class="photo-container">
                    <div class="photo-upload">

                        <input type="file" id="foto" name="foto" accept="image/*">

                        <label for="foto" class="upload-button">
                            Subir foto
                        </label>

                    </div>

                    <div class="photo-preview">
                        <img id="preview" src="" alt="Vista previa">
                        <span id="previewText">
                            Vista previa
                        </span>
                    </div>
                </div>
                <span class="error" id="fotoError"></span>
            </div>

            <div class="input-group">
                <label for="password">
                    Contraseña
                </label>

                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña">
                <span class="error" id="passwordError"></span>

            </div>

            <div class="input-group">
                <label for="confirmPassword">
                    Confirmar contraseña
                </label>

                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirma tu contraseña">
                <span class="error" id="confirmPasswordError"></span>
            </div>

            <div class="buttons">
                <button type="submit" class="btn crear">
                    Crear Cuenta
                </button>

                <a href="LandingPage.html" class="btn regresar">
                    Regresar
                </a>

            </div>

            <p class="login-text">
                ¿Ya tienes cuenta?,
                <a href="IniciarSesion.html">
                    Iniciar Sesión
                </a>

            </p>
        </form>
    </div>
</main>

<script src="ValidacionRegistro.js"></script>
</body> </html>
